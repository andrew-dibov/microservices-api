x-base: &base
  mem_reservation: 256m
  mem_limit: 512m
  cpus: '0.5'

  restart: unless-stopped

  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"

x-healthcheck: &healthcheck
  retries: 3
  timeout: 3s
  interval: 3s
  start_period: 3s
  start_interval: 3s

# ---

services:
  api:
    <<: *base
    image: ${CMD_NAME:-microservices-api}:latest
    container_name: ${CMD_NAME:-microservices-api}

    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_NAME: ${CMD_NAME:-microservices-api}
        APP_PORT: ${APP_PORT:-8080}
        GO_VERSION: ${GO_VERSION:-1.25.0}

    ports:
      - ${HOST_PORT:-8080}:${APP_PORT:-8080}
    volumes:
      - ./certs:/certs:ro

    networks:
      - app

    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --spider --quiet https://localhost:${APP_PORT:-8080}/healthz || exit 1"]
      <<: *healthcheck

    env_file: [".env"]
    environment:
      - SECURITY_CERTIFICATE=/certs/cert.pem
      - SECURITY_KEY=/certs/key.pem
