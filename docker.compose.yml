services:
  api:
    image: microservices-api:latest
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./certs:/certs:ro
    environment:
      - APP_NAME=microservices-api
      - APP_PROD=true
      - APP_PORT=8080
      #---
      - APP_READ_TIMEOUT=5s
      - APP_IDLE_TIMEOUT=5s
      - APP_WRITE_TIMEOUT=5s
      - APP_READYZ_TIMEOUT=2s
      - APP_SHUTDOWN_TIMEOUT=5s
      # ---
      - SECURITY_CERTIFICATE=/certs/cert.pem
      - SECURITY_KEY=/certs/key.pem
      #---
      - SECURITY_API_KEYS=test-25
      - SECURITY_OPEN_ENDPOINTS=/livez,/readyz,/healthz,/metrics
      # ---
      - HISTORY_ADDRESS=history:50051
      - HISTORY_TIMEOUT=5s
      - HISTORY_HEALTH_TIMEOUT=2s
      # ---
      - CURRENCY_ADDRESS=currency:50052
      - CURRENCY_TIMEOUT=5s
      - CURRENCY_HEALTH_TIMEOUT=2s
      - CURRENCY_RATE_LIMIT=5
      - CURRENCY_RATE_BURST=10
      - CURRENCY_RATES_LIMIT=5
      - CURRENCY_RATES_BURST=10
      # ---
      - CONVERSION_ADDRESS=conversion:50053
      - CONVERSION_TIMEOUT=5s
      - CONVERSION_HEALTH_TIMEOUT=2s
      - CONVERSION_CONVERT_LIMIT=5
      - CONVERSION_CONVERT_BURST=10
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --spider --quiet https://localhost:8080/healthz || exit 1"]
      retries: 3
      timeout: 3s
      interval: 3s
      start_period: 3s

    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 512m
    cpus: '0.5'

    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_NAME: ${CMD_NAME:-microservices-api}
        GO_VERSION: ${GO_VERSION:-1.25.0}
    container_name: microservices-api
